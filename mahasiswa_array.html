<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Data Mahasiswa (Array)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow rounded-4 p-4">
        <h3 class="mb-3 text-center fw-bold">Daftar Mahasiswa</h3>
        <table class="table table-bordered table-striped text-center">
            <thead class="table-dark">
                <tr>
                    <th>No</th>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Nilai</th>
                </tr>
            </thead>
            <tbody id="tabel-mhs"></tbody>
        </table>
        <div id="rata-rata" class="alert alert-info text-center fw-bold"></div>
        <div class="text-center mt-2"><a href="index.html" class="text-decoration-none">&larr; Kembali ke Menu</a></div>
    </div>
</div>

<script>
const mahasiswa = [
    {nim: "2023001", nama: "Andi Pratama", nilai: 85},
    {nim: "2023002", nama: "Siti Aminah", nilai: 78},
    {nim: "2023003", nama: "Budi Santoso", nilai: 92},
    {nim: "2023004", nama: "Dewi Lestari", nilai: 65},
    {nim: "2023005", nama: "Joko Anwar", nilai: 88}
];

let tbody = document.getElementById('tabel-mhs');
let total = 0;

mahasiswa.forEach((mhs, index) => {
    total += mhs.nilai;
    tbody.innerHTML += `
        <tr>
            <td>${index + 1}</td>
            <td>${mhs.nim}</td>
            <td>${mhs.nama}</td>
            <td>${mhs.nilai}</td>
        </tr>
    `;
});

let rata = total / mahasiswa.length;
document.getElementById('rata-rata').innerText = "Rata-rata Nilai Kelas: " + rata.toFixed(2);
</script>
</body>
</html>
