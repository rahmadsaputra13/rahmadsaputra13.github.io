<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Kalkulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow rounded-4 p-4">
        <h3 class="mb-3 text-center fw-bold">Kalkulator</h3>
        <div class="mb-3">
            <label class="form-label">Angka Pertama</label>
            <input type="number" step="any" id="angka1" class="form-control" placeholder="Masukkan angka pertama">
        </div>
        <div class="mb-3">
            <label class="form-label">Operator</label>
            <select id="operator" class="form-select">
                <option value="+">Tambah (+)</option>
                <option value="-">Kurang (-)</option>
                <option value="*">Kali (&times;)</option>
                <option value="/">Bagi (&divide;)</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Angka Kedua</label>
            <input type="number" step="any" id="angka2" class="form-control" placeholder="Masukkan angka kedua">
        </div>
        <button onclick="hitung()" class="btn btn-primary w-100">Hitung</button>

        <div id="hasil" class="alert alert-success mt-3 mb-0 text-center d-none fw-bold"></div>
        <div id="error" class="alert alert-danger mt-3 mb-0 text-center d-none"></div>
        <div class="text-center mt-3"><a href="index.html" class="text-decoration-none">&larr; Kembali ke Menu</a></div>
    </div>
</div>

<script>
function hitung() {
    let a1 = parseFloat(document.getElementById('angka1').value);
    let a2 = parseFloat(document.getElementById('angka2').value);
    let op = document.getElementById('operator').value;
    let hasilDiv = document.getElementById('hasil');
    let errorDiv = document.getElementById('error');
    
    hasilDiv.classList.add('d-none');
    errorDiv.classList.add('d-none');

    if (isNaN(a1) || isNaN(a2)) {
        errorDiv.innerText = "Mohon masukkan angka yang valid.";
        errorDiv.classList.remove('d-none');
        return;
    }

    let res;
    if (op === '+') res = a1 + a2;
    else if (op === '-') res = a1 - a2;
    else if (op === '*') res = a1 * a2;
    else if (op === '/') {
        if (a2 === 0) {
            errorDiv.innerText = "Kesalahan: Pembagian dengan nol tidak diperbolehkan!";
            errorDiv.classList.remove('d-none');
            return;
        }
        res = a1 / a2;
    }

    hasilDiv.innerText = "Hasil: " + res;
    hasilDiv.classList.remove('d-none');
}
</script>
</body>
</html>
